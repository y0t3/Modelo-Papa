name: Laboratorio real 19oct 2026 - cotejo cuatro lectores
on:
  push:
    branches: [lab/contraste-real-19oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - name: Comparar 5 cortes PRE con las cabezas de la fuente de la app
        run: npx --yes tsx scripts/lab-contraste-19oct2026.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-CONTRASTE-19OCT2026
          path: lab-results/contraste-19oct2026.json
          if-no-files-found: warn
