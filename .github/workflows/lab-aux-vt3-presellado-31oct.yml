name: PRESELLADO VT3 AUX Ayer - sabado 31 octubre
on:
  push:
    branches:
      - 'lab/aux-vt3-embudo-sin-raiz-31oct2026'
    paths:
      - '.github/workflows/lab-aux-vt3-presellado-31oct.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sellar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Control de geometria y cupos
        run: npx --yes tsx scripts/test-aux-embudo-vt3.ts
      - name: PRE exclusivo antes del primer sorteo - sin POST
        run: npx --yes tsx scripts/lock-aux-ayer-vt3-31oct.ts
      - uses: actions/upload-artifact@v4
        with:
          name: PRESELLADO-AUX-AYER-31OCT
          path: auditorias/aux-embudo-vt3/PRESELLADO_31OCT.json
          if-no-files-found: error
