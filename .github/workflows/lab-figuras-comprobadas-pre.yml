name: Laboratorio figuras comprobadas hacia PRE
on:
  push:
    branches: [lab/figuras-ganadoras-continuidad-pre-17oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estudio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Comprobar tipos TypeScript
        run: npx tsc --noEmit
      - name: Seguir figuras ganadoras verificadas y evaluar lecturas PRE
        run: npx --yes tsx scripts/lab-figuras-comprobadas-a-pre.ts
      - name: Conservar recorridos, negativos, fechas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB-FIGURAS-COMPROBADAS-PRE-520
          path: lab-results/FIGURAS_COMPROBADAS_A_PRE_520.json
          if-no-files-found: warn
