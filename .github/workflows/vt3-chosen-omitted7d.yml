name: VT3 chosen versus omitted visual audit
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt3-chosen-omitted7d.yml'
      - 'src/vt3SelectedVsExcluded7d.ts'
      - 'scripts/test-vt3-selected-vs-excluded7d.cjs'
      - 'scripts/run-vt3-selected-vs-excluded7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Test unchanged adaptive Top3 and all pre-draw features
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt3-selected-vs-excluded7d.cjs
      - name: Chronological audit on unchanged historical selector
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-vt3-selected-vs-excluded7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/vt3-omitted-$LABEL.json"
      - name: Preserve outcomes and frozen input features
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vt3-chosen-omitted-${{ matrix.label }}
          path: out/vt3-omitted-*.json
          if-no-files-found: error
