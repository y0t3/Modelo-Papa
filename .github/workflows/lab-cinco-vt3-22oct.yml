name: LAB Cinco VT3 y validacion previa
on:
  push:
    branches: [lab/auditoria-22oct2026-motores]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vt3:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Revisar 5 VT3 y estrategias sin nueva geometria
        run: npx --yes tsx scripts/lab-cinco-vt3-22oct.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-cinco-vt3-22oct
          path: auditorias/22oct2026-motores/profundizacion
          if-no-files-found: warn
