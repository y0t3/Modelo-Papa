name: LAB reducción de extensiones VT3 sin perder cobertura
on:
  push:
    branches: [lab/reduccion-vt3-cobertura-30oct]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  estudio:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Test reducción reversible sin contaminación POST
        run: npx --yes tsx scripts/test-reduccion-extensiones.ts
      - name: Test geometría madre y AUX
        run: npx --yes tsx scripts/test-extensiones-aux.ts
      - name: Regresión oficial MV1
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Reproducir ventanas y diez controles de igual presupuesto
        env:
          TRES_LABEL: octubre-reduccion
          TRES_FROM: '2026-10-12'
          TRES_TO: '2026-10-29'
          REDUCIR_EXT: '1'
        run: npx --yes tsx scripts/lab-tres-hojas-figuras.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reduccion-vt3-octubre-30oct
          path: auditorias/radar-tres-hojas/octubre-reduccion.json
          if-no-files-found: warn
