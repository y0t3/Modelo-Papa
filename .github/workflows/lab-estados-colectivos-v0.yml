name: LAB Estados Colectivos RAW 2025-2026
on:
  push:
    branches: [lab/estados-colectivos-21oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estados:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Comprobar tipado del laboratorio
        run: npx tsc --noEmit
      - name: Medir estados colectivos sin hoja ni +11
        run: npx --yes tsx scripts/lab-estados-colectivos-v0.ts
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-ESTADOS-COLECTIVOS-V0
          path: lab-results/estados-colectivos-v0.json
          if-no-files-found: warn
