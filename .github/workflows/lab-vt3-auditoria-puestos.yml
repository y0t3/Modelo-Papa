name: VT3 auditoria de puestos 9 y 10
on:
  push:
    branches: [lab-vt3-auditoria-puestos-9-10-13oct2026]
    paths:
      - 'scripts/lab-vt3-auditoria-puestos.mjs'
      - 'PROTOCOLO_VT3_AUDITORIA_PUESTOS_9_10_13OCT2026.md'
      - '.github/workflows/lab-vt3-auditoria-puestos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apartar POST de las cabezas antes de crear PRE
        run: |
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json /tmp/vt3-puestos-original-post.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json /tmp/vt3-puestos-original-noct-post.json
      - name: Verificar orden VT3 y sellar políticas de posiciones
        run: node scripts/lab-vt3-auditoria-puestos.mjs pre
      - name: Restaurar POST y ejecutar falsaciones cronológicas
        run: |
          mv /tmp/vt3-puestos-original-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json
          mv /tmp/vt3-puestos-original-noct-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json
          node scripts/lab-vt3-auditoria-puestos.mjs post
      - uses: actions/upload-artifact@v4
        with:
          name: VT3-puestos-9-10-115
          path: auditorias/vt3-auditoria-puestos-115-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Respaldar PRE sellado y resultados POST en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-auditoria-puestos-115-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): puestos 9/10 ranking, empates y controles cronologicos'
            git push origin HEAD:lab-vt3-auditoria-puestos-9-10-13oct2026
          fi
