name: LAB VT3 descomposicion historico fisico
on:
  push:
    branches: [lab/vt3-descomposicion-historico-fisico-25nov2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rango:
          - {nombre: mayo-2024, inicio: '2024-05-01', fin: '2024-05-31'}
          - {nombre: junio-2024, inicio: '2024-06-01', fin: '2024-06-30'}
          - {nombre: julio-2024, inicio: '2024-07-01', fin: '2024-07-31'}
          - {nombre: abril-2025, inicio: '2025-04-01', fin: '2025-04-30'}
          - {nombre: referencia-agosto-2026, inicio: '2026-08-01', fin: '2026-08-31'}
    name: ${{ matrix.rango.nombre }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Separar admision bloques fuentes y distribucion
        env:
          ADM_FROM: ${{ matrix.rango.inicio }}
          ADM_TO: ${{ matrix.rango.fin }}
        run: npx --yes tsx scripts/lab-vt3-descomposicion.ts
