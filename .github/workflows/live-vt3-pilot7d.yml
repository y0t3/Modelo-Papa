name: Live VT3 on progressive plus 11
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/live-vt3-pilot7d.yml'
      - 'src/liveVT3Pilot7d.ts'
      - 'scripts/test-live-vt3-pilot7d.cjs'
      - 'scripts/run-live-vt3-pilot7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Verify all five live turns and zero leakage
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-live-vt3-pilot7d.cjs
      - name: Historical replay with fixed original adaptive weights
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-live-vt3-pilot7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/live-vt3-$LABEL.json"
      - name: Save every candidate and real outcome
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: live-vt3-${{ matrix.label }}
          path: out/live-vt3-*.json
          if-no-files-found: error
