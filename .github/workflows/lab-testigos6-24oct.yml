name: LAB seis jornadas testigos ausentes 24 octubre
on:
  push:
    branches: [lab/lalo-vt234-rastro-faltantes-24oct]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx --yes tsx scripts/lab-testigos6-24oct.ts
      - run: npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        with:
          name: testigos-seis-jornadas-vt3-24oct
          path: auditorias/lalo-retro-sabado24-vt234/seis-jornadas-testigos-faltantes.json
          if-no-files-found: error
