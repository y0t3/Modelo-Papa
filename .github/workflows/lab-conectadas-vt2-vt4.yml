name: Laboratorio configuraciones conectadas VT2 VT4
on:
  push:
    branches: [lab/conectadas-vt2-vt4-17oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  derivaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Probar VT2 VT4 sin crear madres nuevas
        run: npx --yes tsx scripts/test-lab-conectadas-vt2-vt4.ts
      - name: Reprobar figuras conectadas
        run: npx --yes tsx scripts/test-lab-vt3-configuraciones-conectadas.ts
      - name: Comparar 520 PRE Lalo Geometría y Conectadas en VT2 VT4
        run: npx --yes tsx scripts/lab-figuras-comprobadas-a-pre.ts
      - name: Control adicional VT2 VT4 16oct (reconstrucción no sellada)
        env:
          LAB_EVALUAR_16_OCT: '1'
        run: npx --yes tsx scripts/lab-figuras-comprobadas-a-pre.ts
      - name: Preservar archivo de 520 cortes y negativos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB-CONFIGURACIONES-VT2-VT4-520
          path: lab-results/FIGURAS_COMPROBADAS_A_PRE_*.json
          if-no-files-found: warn
