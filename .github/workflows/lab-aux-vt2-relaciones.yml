name: LAB Lalo Auxiliar VT2 AYER y HOY
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/lab-vt2-aux-relaciones-ayer-hoy.ts
      - .github/workflows/lab-aux-vt2-relaciones.yml
    branches:
      - feature/top10-minihojas-lectura-29oct2026
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Replay AYER HOY sin resultados futuros
        run: npx --yes tsx scripts/lab-vt2-aux-relaciones-ayer-hoy.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auxiliar-vt2-ayer-hoy-octubre
          path: auditorias/aux-vt2-relaciones/resultados.json
          if-no-files-found: warn
