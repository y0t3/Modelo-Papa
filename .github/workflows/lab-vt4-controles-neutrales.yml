name: VT4 controles neutrales de familias fisicas
on:
  push:
    branches: [lab-vt4-diversidad-madres-top10-13oct2026]
    paths:
      - 'scripts/lab-vt4-controles-neutrales.mjs'
      - 'PROTOCOLO_VT4_CONTROLES_NEUTRALES_13OCT2026.md'
      - '.github/workflows/lab-vt4-controles-neutrales.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aislar los resultados y fixture para construir controles PRE
        run: |
          mv auditorias/vt4-diversidad-madres-top10-115-13oct2026/OBJETIVOS_POST_115.json /tmp/vt4-control-post.json
          mv fixtures/cabezas-sept-oct-2026-30-fechas.json.gz.b64 /tmp/vt4-control-fixture.b64
          test ! -f auditorias/vt4-diversidad-madres-top10-115-13oct2026/OBJETIVOS_POST_115.json
      - name: Generar 500x115 controles únicos y 500x115 con diez madres físicas
        run: node scripts/lab-vt4-controles-neutrales.mjs pre
      - name: Sellar elecciones físicas aleatorias antes de reponer resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_PRE.json
          git add auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_SELLO.json
          git commit -m 'seal(VT4): 500 bancos neutrales y 500 bancos de diez madres'
          git push origin HEAD:lab-vt4-diversidad-madres-top10-13oct2026
      - name: Reponer resultados sólo después del sello y evaluar distribuciones
        run: |
          mv /tmp/vt4-control-post.json auditorias/vt4-diversidad-madres-top10-115-13oct2026/OBJETIVOS_POST_115.json
          mv /tmp/vt4-control-fixture.b64 fixtures/cabezas-sept-oct-2026-30-fechas.json.gz.b64
          node scripts/lab-vt4-controles-neutrales.mjs post
      - uses: actions/upload-artifact@v4
        with:
          name: VT4-controles-neutrales-115
          path: |
            auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_PRE.json
            auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_SELLO.json
            auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_RESUMEN.json
          retention-days: 60
          if-no-files-found: error
      - name: Versionar resultados del control
        run: |
          git add auditorias/vt4-diversidad-madres-top10-115-13oct2026/CONTROL_RESUMEN.json
          git commit -m 'data(VT4): distribuciones de los controles de diez plazas reales'
          git push origin HEAD:lab-vt4-diversidad-madres-top10-13oct2026
