name: Rebuild full visual marked plus11 sheets
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/visual-marked-sheets7d.yml'
      - 'src/visualMarkedSheet7d.ts'
      - 'src/markedSheetAfterDraw7d.ts'
      - 'scripts/test-visual-marked-sheet7d.cjs'
      - 'scripts/run-visual-marked-sheets7d.cjs'
      - 'scripts/run-visual-chain7d.cjs'
      - 'scripts/run-morphology-atlas7d.cjs'
      - 'scripts/run-blind-visual-exam7d.cjs'
      - 'scripts/run-causal-convergence-inventory7d.cjs'
      - 'scripts/visor-ciego7d.js'
      - 'scripts/visor-ciego7d.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marked-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Test complete VT2 VT3 VT4 reconstruction and causal stages
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: |
          node scripts/test-marked-sheet-after-draw7d.cjs
          node scripts/test-visual-marked-sheet7d.cjs
      - name: Build interactive real marked sheets 29 and 30 September
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/run-visual-marked-sheets7d.cjs --from=2026-09-29 --to=2026-09-30 --out=out/hojas-marcadas-septiembre
      - name: Build 23-30 September historical marked-sheet visual chain with causal masking
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/run-visual-chain7d.cjs --from=2026-09-23 --to=2026-09-30 --out=out/cadena-visual-septiembre
      - name: Verify and build descriptive movement atlas
        run: |
          node --check scripts/run-morphology-atlas7d.cjs
          node scripts/run-morphology-atlas7d.cjs --test-only=true
          node scripts/run-morphology-atlas7d.cjs --input=out/cadena-visual-septiembre --out=out/atlas-cambios-visuales-septiembre
      - name: Test and build 30 sealed-view before-draw observation cuts
        run: |
          node --check scripts/run-blind-visual-exam7d.cjs
          node --check scripts/visor-ciego7d.js
          node scripts/run-blind-visual-exam7d.cjs --test-only=true
          node scripts/run-blind-visual-exam7d.cjs --input=out/cadena-visual-septiembre --out=out/examen-visual-ciego-septiembre
      - name: Test and enumerate ALL pre-turn independent-route convergences
        run: |
          node --check scripts/run-causal-convergence-inventory7d.cjs
          node scripts/run-causal-convergence-inventory7d.cjs --test-only=true
          node scripts/run-causal-convergence-inventory7d.cjs --input=out/examen-visual-ciego-septiembre --out=out/convergencias-causales-septiembre
      - name: Preserve interactive marked historical sheets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hojas-11-marcadas-septiembre-2026
          path: out/hojas-marcadas-septiembre/
          if-no-files-found: error

      - name: Preserve multi-day visual chain and all causal comparisons
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cadena-visual-marcada-23-30-septiembre-2026
          path: out/cadena-visual-septiembre/
          if-no-files-found: error

      - name: Preserve full movement atlas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-giros-traslaciones-hojas-marcadas-septiembre
          path: out/atlas-cambios-visuales-septiembre/
          if-no-files-found: error

      - name: Preserve thirty historical pre-draw blind viewers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: examen-ciego-treinta-turnos-septiembre
          path: out/examen-visual-ciego-septiembre/
          if-no-files-found: error

      - name: Preserve non-ranked convergence inventory and temporal ambiguity
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inventario-convergencias-previas-directas-invertidas
          path: out/convergencias-causales-septiembre/
          if-no-files-found: error
