name: VT3 atlas cuatro dimensiones A B C D y controles
on:
  push:
    branches: [lab-vt3-atlas-cuatro-dimensiones-14oct2026]
    paths:
      - 'scripts/lab-vt3-atlas-cuatro-dimensiones.mjs'
      - 'PROTOCOLO_VT3_ATLAS_CUATRO_DIMENSIONES_14OCT2026.md'
      - '.github/workflows/lab-vt3-atlas-cuatro-dimensiones.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Separar POST de los insumos PRE
        run: |
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json /tmp/atlas4d-base-post.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json /tmp/atlas4d-noct-post.json
      - name: Crear registro PRE físico y sellarlo
        run: node scripts/lab-vt3-atlas-cuatro-dimensiones.mjs pre
      - name: Reponer resultados y medir hipótesis
        run: |
          mv /tmp/atlas4d-base-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json
          mv /tmp/atlas4d-noct-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json
          node scripts/lab-vt3-atlas-cuatro-dimensiones.mjs post
      - name: Publicar atlas auditable
        uses: actions/upload-artifact@v4
        with:
          name: VT3-atlas-cuatro-dimensiones-115
          path: auditorias/vt3-atlas-cuatro-dimensiones-115-14oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Respaldar resultados en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-atlas-cuatro-dimensiones-115-14oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): atlas A-B-C-D PRE sellado y controles POST 115 cortes'
            git push origin HEAD:lab-vt3-atlas-cuatro-dimensiones-14oct2026
          fi
