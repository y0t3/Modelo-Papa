name: September visual shape orientation and zone atlas D7 vs D1
on:
  push:
    branches: [auditoria-sorteo-10oct-2026]
    paths:
      - '.github/workflows/atlas-zonas-orientaciones-d7d1-sept.yml'
      - 'scripts/run-route-zones-orientations-d7d1.cjs'
      - 'PROTOCOLO_SEGUIMIENTO_FORMAS_ZONAS_ORIENTACIONES_D7_D1_SEPT2026.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estudiar-huellas-y-desapariciones:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript to reconstruct historical marked boards
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Require tests for adjacency, inversion, zones and disappearing routes
        run: |
          node --check scripts/run-route-zones-orientations-d7d1.cjs
          node scripts/run-route-zones-orientations-d7d1.cjs --test-only=true
      - name: Reconstruct 20 historically marked full sheets (no predictive engine)
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: |
          node scripts/run-visual-chain7d.cjs --from=2026-09-08 --to=2026-09-21 --out=out/cadena-08-21
          node scripts/run-visual-chain7d.cjs --from=2026-09-21 --to=2026-09-30 --out=out/cadena-21-30
          mkdir -p out/cadena-visual-08-30-septiembre
          cp -a out/cadena-08-21/. out/cadena-visual-08-30-septiembre/
          cp -a out/cadena-21-30/. out/cadena-visual-08-30-septiembre/
          test "$(find out/cadena-visual-08-30-septiembre -maxdepth 1 -name '*-5-Nocturno.json' | wc -l)" -eq 20
      - name: Generate all D7 same-weekday and D1 last-drawday comparisons
        run: |
          node scripts/run-route-zones-orientations-d7d1.cjs --input=out/cadena-visual-08-30-septiembre --out=out/atlas-zonas-orientaciones-septiembre
      - name: Check every old physical figure belongs to one exclusive category
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const base='out/atlas-zonas-orientaciones-septiembre/';
          const a=JSON.parse(fs.readFileSync(base+'RESUMEN.json'));
          const details=JSON.parse(fs.readFileSync(base+'TODOS_LOS_CAMINOS_PARES_Y_NEGATIVOS.json'));
          assert.equal(a.dates.length,20);assert.equal(a.byAxis['D-1'].pairs,19);
          assert(a.byAxis['D-7'].pairs>=10);
          assert.equal(details.length,a.byAxis['D-1'].pairs+a.byAxis['D-7'].pairs);
          const classes=['MISMA_HUELLA','MISMA_FORMA_DESPLAZADA','TOQUE_EN_EXTREMO','TOQUE_INTERNO','SIN_CONTACTO','SIN_FIGURA_COMPARABLE'];
          for(const c of details){
            for(const t of ['vt2','vt3','vt4']){
              const s=c.priorityCounts[t];
              assert.equal(classes.reduce((v,k)=>v+s[k],0),s.old);
            }
            for(const old of c.old){
              assert(classes.includes(old.priority));
              assert(old.headMarks.length>0);
              assert(old.allLinks.every(x=>x.id&&!x.id.includes('undefined')));
            }
            if(c.axis==='D-7')assert.equal(
              (Date.parse(c.toDate)-Date.parse(c.fromDate))/86400000,7);
          }
          console.log('ATLAS_100_PERCENT_OLD_NEGATIVES_INCLUDED '+details.length+' comparisons');
          NODE
      - name: Publish complete visual atlas, each old head, all negatives, report
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-OCULAR-SEPT-D7-D1-ZONAS-DIRECCIONES-NEGATIVOS
          path: out/atlas-zonas-orientaciones-septiembre/
          if-no-files-found: error
