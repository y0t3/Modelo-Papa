name: VT4 especificidad de apoyo histórico por hija 03oct
on:
  push:
    branches: [lab-vt4-complementariedad-d1-d7-13oct2026]
    paths:
      - 'scripts/lab-vt4-complementariedad-especificidad.mjs'
      - '.github/workflows/lab-vt4-complementariedad-especificidad.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  especificidad:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Auditar retrospectivamente hermanas que compiten por respaldo D1 o D7
        run: node scripts/lab-vt4-complementariedad-especificidad.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vt4-especificidad-03oct
          path: auditorias/vt4-complementariedad-d1-d7-115-13oct2026/DIAGNOSTICO_ESPECIFICIDAD_03OCT_POST.json
          retention-days: 60
          if-no-files-found: error
      - name: Guardar diagnostico POST separado del PRE y sin tocar main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt4-complementariedad-d1-d7-115-13oct2026/DIAGNOSTICO_ESPECIFICIDAD_03OCT_POST.json
          git commit -m 'data(VT4): especificidad de señales D1 y D7 por hermana física'
          git push origin HEAD:lab-vt4-complementariedad-d1-d7-13oct2026
