name: LAB VT2 Lalo posiciones libres intradia
on:
  push:
    branches:
      - lab/vt2-posiciones-libres-intradia-29oct2026
      - lab/vt2-transiciones-familias-cinco-dias-29oct2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posiciones:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Test PRE cronologico y posiciones VT2
        run: npx --yes tsx scripts/lab-vt2-posiciones-libres.ts
      - name: Validacion sin recalibrar pares de puestos por turno
        run: npx --yes tsx scripts/lab-vt2-congelar-puestos.ts
      - name: Seguimiento de familias entre turnos y seis dias
        run: npx --yes tsx scripts/lab-vt2-relaciones-familias.ts
      - name: Comparación VT2 de hasta dos familias con testigos del mismo día
        run: npx --yes tsx scripts/lab-vt2-dos-familias.ts
      - name: Regression MV1 sin cambios
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vt2-posiciones-intradia-635-cortes
          path: auditorias/vt2-posiciones-libres/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vt2-relaciones-familias-intradia
          path: auditorias/vt2-relaciones-familias/*.json
          if-no-files-found: error
