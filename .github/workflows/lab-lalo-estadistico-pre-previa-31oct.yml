name: PRESELLADO Lalo VT3 estadistico Previa 31 octubre
on:
  push:
    branches:
      - 'lab/lalo-vt3-baseline-estadistico-31oct2026'
    paths:
      - '.github/workflows/lab-lalo-estadistico-pre-previa-31oct.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sello_pre:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Comprobar cobertura numerica y PRE +11
        run: |
          npx --yes tsx scripts/test-lalo-vt3-estadistico.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - name: Generar Top10 de PREVIA sabado 31 octubre sin acceder a resultados
        run: npx --yes tsx scripts/lock-lalo-estadistico-previa-31oct.ts
      - uses: actions/upload-artifact@v4
        with:
          name: PRESELLADO-LALO-ESTADISTICO-PREVIA-31OCT
          path: auditorias/lalo-vt3-estadistico/PRE_PREVIA_31OCT.json
          if-no-files-found: error
