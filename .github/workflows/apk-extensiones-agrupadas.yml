name: APK de prueba extensiones VT2 VT3 agrupadas
on:
  workflow_dispatch:
  push:
    branches: [feature/extensiones-agrupadas-experimental-30oct]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc -p tsconfig.app-ui.json --noEmit
      - name: Pruebas motor Lalo VT2 VT3 VT4
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Probar observabilidad VT3
        run: npx --yes tsx scripts/test-consolidacion-lalo.ts
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Create Modelo Lalo launcher icon (azul y dorado)
        env:
          MODELO_LALO_ICON_LABEL: LALO
        run: bash .github/scripts/icon-modelo-lalo.sh
      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modelo-Lalo-Extensiones-Agrupadas-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
