name: VT3 estratos fisicos VT4 con control de exposicion 115
on:
  push:
    branches: [lab-vt3-rangos-exposicion-vt4-13oct2026]
    paths:
      - 'scripts/lab-vt3-rangos-exposicion-vt4.mjs'
      - 'PROTOCOLO_VT3_RANGOS_EXPOSICION_VT4_13OCT2026.md'
      - '.github/workflows/lab-vt3-rangos-exposicion-vt4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contrastar rangos con 115 mapas sellados y 575 cabezas historicas
        run: node scripts/lab-vt3-rangos-exposicion-vt4.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vt3-rangos-exposicion-vt4-115
          path: auditorias/vt3-rangos-exposicion-vt4-115-13oct2026/
          retention-days: 60
      - name: Respaldar reporte diagnostico independiente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-rangos-exposicion-vt4-115-13oct2026/
          git commit -m 'data(VT3): control de exposicion por banda materna 115 cortes'
          git push origin HEAD:lab-vt3-rangos-exposicion-vt4-13oct2026
