name: VALIDAR explorador extensiones agrupadas
on:
  push:
    branches: [feature/extensiones-agrupadas-experimental-30oct]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Comprobar tipos de App y panel visual
        run: npx tsc -p tsconfig.app-ui.json --noEmit
      - name: Verificar compresión de extensiones sin descartes
        run: npx --yes tsx scripts/test-reduccion-extensiones.ts
      - name: Probar formaciones auxiliares fuera de Top10
        run: npx --yes tsx scripts/test-extensiones-aux.ts
      - name: Probar padres y madres geométricas
        run: npx --yes tsx scripts/test-tres-hojas-figuras.ts
      - name: Comprobar motor oficial intacto
        run: npx --yes tsx scripts/test-motor-lalo.ts
