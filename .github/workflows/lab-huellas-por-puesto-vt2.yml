name: LAB Huellas por puesto VT2 Nocturna
on:
  push:
    branches: [lab/huellas-por-puesto-vt2-nocturna-29oct]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  figuras:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: junio-julio
            from: '2026-06-01'
            through: '2026-07-31'
          - label: agosto-septiembre
            from: '2026-08-01'
            through: '2026-09-30'
          - label: octubre
            from: '2026-10-12'
            through: '2026-10-28'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: No mezclar cifras con figura
        run: npx --yes tsx scripts/test-huellas-por-puesto-vt2.ts
      - name: MV1 no modificado
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Replay de figuras por puesto y semana
        env:
          HUELLAS_LABEL: ${{ matrix.label }}
          HUELLAS_FROM: ${{ matrix.from }}
          HUELLAS_TO: ${{ matrix.through }}
        run: npx --yes tsx scripts/lab-huellas-por-puesto-vt2.ts
      - name: Guardar fichas de figuras y aciertos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huellas-${{ matrix.label }}
          path: auditorias/huellas-por-puesto/*.json
          if-no-files-found: warn
