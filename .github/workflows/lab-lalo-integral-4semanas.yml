name: LAB Modelo Lalo Integral Cuatro Semanas
on:
  push:
    branches: [lab/modelo-lalo-integral-4semanas-21oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integral:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Verificar TypeScript, fuentes, geometria y corte PRE
        run: |
          npx tsc --noEmit
          npx --yes tsx scripts/lab-aux-mapeo-fuente-test.ts
          npx --yes tsx scripts/lab-aux-geometria-test.ts
          npx --yes tsx scripts/lab-integral-test.ts
      - name: Comparar cuatro semanas completas PRE 2026
        run: npx --yes tsx scripts/lab-integral-4semanas.ts
      - name: Auditar aciertos ganados y perdidos por modalidad
        run: npx --yes tsx scripts/lab-integral-diagnostico.ts
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAB-MODELO-LALO-INTEGRAL-4SEMANAS
          path: |
            lab-results/modelo-lalo-integral-4semanas.json
            lab-results/modelo-lalo-integral-diagnostico.json
          if-no-files-found: warn
