name: LAB Lalo filtro fisico VT3
on:
  push:
    branches: [lab/lalo-vt3-filtro-fisico-25oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eligibility-funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Contar formables no reconocidas y shadow geométrico
        run: |
          npx --yes tsx scripts/lab-lalo-filtro-vt3.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lalo-vt3-filtro-fisico
          path: auditorias/lalo-filtro-vt3-25oct/resultados
          if-no-files-found: warn
