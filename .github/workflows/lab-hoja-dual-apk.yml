name: LAB APK Hoja Dual AUX Predictiva
on:
  workflow_dispatch:
  push:
    branches: [lab/hoja-dual-predictiva-aux-21oct2026]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Pruebas motor Lalo VT2 VT3 VT4
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Probar observabilidad VT3
        run: npx --yes tsx scripts/test-consolidacion-lalo.ts
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Create Modelo Lalo launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p /tmp/modelo-lalo-icon
          convert -size 1024x1024 xc:'#321066' -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 300 -annotate +0+15 'ML' /tmp/modelo-lalo-icon/icon.png
          for spec in 'mipmap-mdpi 48' 'mipmap-hdpi 72' 'mipmap-xhdpi 96' 'mipmap-xxhdpi 144' 'mipmap-xxxhdpi 192'; do
            set -- $spec
            dir=$1
            size=$2
            mkdir -p android/app/src/main/res/$dir
            rm -f android/app/src/main/res/$dir/ic_launcher.webp android/app/src/main/res/$dir/ic_launcher_round.webp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
            convert /tmp/modelo-lalo-icon/icon.png -resize ${size}x${size} PNG24:android/app/src/main/res/$dir/ic_launcher.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          done
      - name: Build standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modelo-Lalo-Hoja-Dual-LAB-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
