name: VT3 concrete lineage in progressive plus11
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt3-concrete-evolution7d.yml'
      - 'src/vt3ConcreteEvolution7d.ts'
      - 'scripts/test-vt3-concrete-evolution7d.cjs'
      - 'scripts/run-vt3-concrete-evolution7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Check physical VT3 episode chronology and target-blind re-read
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt3-concrete-evolution7d.cjs
      - name: Export actual Sep 30 five-stage route evidence
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/run-vt3-concrete-evolution7d.cjs --date=2026-09-30 --out=out/vt3-concrete-2026-09-30
      - name: Save all pre-result numeric and spatial VT3 lineages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vt3-concrete-evolution-2026-09-30
          path: out/vt3-concrete-2026-09-30/
          if-no-files-found: error
