name: LAB radar de figuras entre turnos
on:
  push:
    branches: [lab/radar-figuras-entre-turnos-29oct]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: junio-julio
            from: '2026-06-01'
            through: '2026-07-31'
          - label: agosto-septiembre
            from: '2026-08-01'
            through: '2026-09-30'
          - label: octubre
            from: '2026-10-12'
            through: '2026-10-28'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Unit test physical routes first and no value dependence
        run: npx --yes tsx scripts/test-radar-figuras.ts
      - name: Existing temporal radar
        run: npx --yes tsx scripts/test-radar-ventana-corta.ts
      - name: Original MV1 regression
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Replay across turns PRE
        env:
          FORMS_LABEL: ${{ matrix.label }}
          FORMS_FROM: ${{ matrix.from }}
          FORMS_TO: ${{ matrix.through }}
        run: npx --yes tsx scripts/lab-radar-figuras-entre-turnos.ts
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-figuras-${{ matrix.label }}
          path: auditorias/radar-figuras/*.json
          if-no-files-found: warn
