name: LAB Lalo hoja Nocturna por jurisdiccion
on:
  push:
    branches: [lab/lalo-hoja-nocturna-por-jur-25oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jurisdiction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Comparar fuentes completas y Nocturnas reales por jurisdiccion
        run: |
          npx --yes tsx scripts/lab-lalo-nocturna-por-jur.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lalo-hoja-previa-por-jur
          path: auditorias/lalo-vt3-feriados-d1-25oct/por-jurisdiccion
          if-no-files-found: warn
