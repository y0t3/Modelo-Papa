name: LAB Lalo sitio y ciclo 6 jornadas
on:
  push:
    branches: [lab/lalo-vt3-ciclo-ubicacion-25oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  location-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Comprobar estado de formas misma fuente y sitio cercano
        run: |
          npx --yes tsx scripts/lab-lalo-ciclo-ubicacion-vt3.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lalo-vt3-ubicacion-6-jornadas
          path: auditorias/lalo-ciclo-vida-figuras-25oct/ubicacion
          if-no-files-found: warn
