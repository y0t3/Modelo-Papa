name: Validar aplicación Lalo unificada
on:
  push:
    branches: [consolidacion-lalo-observabilidad-14oct2026, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Expo y TypeScript
        run: npm install
      - name: Validar tipos de toda la aplicación
        run: npx tsc --noEmit
      - name: Verificar motor Lalo VT2 VT3 VT4 sin modificaciones
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Verificar nueva observabilidad sin fuga POST
        run: npx --yes tsx scripts/test-consolidacion-lalo.ts
      - name: Confirmar relación física directa o bifurcada con el ejemplo 033 y 440
        run: npx --yes tsx scripts/test-respaldos-explicados.ts
      - name: Validar respaldo visual de raíces históricas VT3
        run: npx --yes tsx scripts/test-antecedentes-visuales.ts
      - name: Validar pronóstico personal Papá y balance semanal
        run: npx --yes tsx scripts/test-pronostico-papa.ts
      - name: Verificar filtros de turno y navegación desde Cabezas
        run: npx --yes tsx scripts/test-hoja-turnos-cabezas.ts
      - name: Verificar zoom en las seis pestañas y estado independiente
        run: npx --yes tsx scripts/test-zoom-pestanas.ts
      - name: Verificar zoom horizontal, fondo tenue y regresiones UI
        run: npx --yes tsx scripts/test-correcciones-ui-14oct.ts
      - name: Comprobar diversidad de madres VT3 en Top10 VT4
        run: npx --yes tsx scripts/test-vt4-diversidad-madres.ts
      - name: Cotejo POST VT4 por valor físico exacto
        run: npx --yes tsx scripts/test-cotejo-vt4-exacto.ts
      - name: Impedir inversión ficticia de VT4 en panorama predictivo
        run: npx --yes tsx scripts/test-auditoria-invariantes-vt4.ts
      - name: Verificar jornadas parciales con Montevideo como fuente de Nocturna
        run: npx --yes tsx scripts/test-historico-sorteos-parciales.ts
      - name: Comprobar fechas naturales y Atrás de Android entre pestañas
        run: npx --yes tsx scripts/test-info-fechas-atras.ts
      - name: Verificar secuencia PRE de candidaturas físicas antes de cada turno
        run: npx --yes tsx scripts/test-info-movimiento-candidatos.ts
      - name: Comparar el mismo turno en cuatro jornadas y proteger el próximo sorteo
        run: npx --yes tsx scripts/test-info-panorama-turnos.ts
      - name: Verificar INFO con panorama y secuencia sin fuga futura
        run: npx --yes tsx scripts/test-info-jornada-guia.ts
      - name: Validar libro de apuestas con importe igual en bajada 4-3-2
        run: npx --yes tsx scripts/test-lalo-libro-apuestas.ts
      - name: Confirmar que no quedan importaciones del predictor retirado
        run: |
          if grep -REn "(from ['\"][^'\"]*(predictive|analysisEngine|routeHistory|routeLife)['\"])" App.tsx src/ ; then
            echo "Importación obsoleta: revisar el código antes de fusionar."
            exit 1
          fi
