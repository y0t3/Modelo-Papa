name: Verify 10 October Nocturna heads from existing source
on:
  push:
    branches: [auditoria-sorteo-10oct-2026]
    paths: [.github/workflows/verificar-nocturna-10oct.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nocturna-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch raw dated lottery source and preserve all full four-digit heads
        run: |
          mkdir -p out/nocturna-real-10oct
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const url='https://vivitusuerte.com/api/juegos/cabezasDiarias?fecha=2026-10-10&_='+Date.now();
          const r=await fetch(url,{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          assert(r.ok,'Fuente HTTP '+r.status);
          const data=await r.json();
          fs.writeFileSync('out/nocturna-real-10oct/RESPUESTA_ORIGINAL.json',JSON.stringify(data,null,2));
          const ids={'1':'Ciudad','2':'Provincia','3':'Santa Fé','4':'Montevideo','5':'Entre Ríos','7':'Córdoba'};
          const turns={'momento_5':'Previa','momento_1':'Primera','momento_2':'Matutino','momento_3':'Vespertino','momento_4':'Nocturno'};
          const value=v=>{
            const raw=typeof v==='object'&&v!==null?(v.numero??v.cabeza??v.resultado??v.valor??v.primero??v.numero_1):v;
            if(raw===null||raw===undefined||raw==='----'||raw==='')return '----';
            const m=String(raw).match(/\d+/);return m?m[0].slice(-4).padStart(4,'0'):'----';
          };
          const heads=Object.fromEntries(Object.values(turns).map(t=>[t,{}]));
          for(const [id,row] of Object.entries(data.datos||{})){
            const name=ids[id];if(!name)continue;
            for(const [key,turn] of Object.entries(turns))heads[turn][name]=value(row?.[key]);
          }
          const check=(turn,jur,value)=>assert.equal(heads[turn][jur],value,turn+' '+jur+' no coincide con foto ya verificada');
          check('Previa','Ciudad','0956');
          check('Primera','Ciudad','8393');
          check('Matutino','Ciudad','6542');
          check('Vespertino','Ciudad','5185');
          const available=Object.entries(heads.Nocturno).filter(([j,v])=>/^\d{4}$/.test(v));
          const document={source:'vivitusuerte.com/api/juegos/cabezasDiarias',date:'2026-10-10',
            retrievedAtUtc:new Date().toISOString(),heads,availableNocturna:available.length,
            rules:'Do not replace missing results with yesterday numbers. Include only this dated response; preserve raw original.'};
          fs.writeFileSync('out/nocturna-real-10oct/CABEZAS_AUDITADAS.json',JSON.stringify(document,null,2));
          console.log('NOCTURNA_10OCT_VERIFICADA '+JSON.stringify(document));
          assert(available.length>=4,'Nocturna no publicada con cobertura suficiente en fuente actual. Conservamos respuesta ORIGINAL.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FUENTE-CABEZAS-NOCTURNA-10-OCT-2026-VERIFICADA
          path: out/nocturna-real-10oct/
          if-no-files-found: error
