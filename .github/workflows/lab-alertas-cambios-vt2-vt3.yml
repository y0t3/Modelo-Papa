name: LAB alertas de cambios de figuras VT2 VT3
on:
  push:
    branches: [lab/alertas-cambios-formas-vt2-vt3-29oct]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Test cambios y blindaje temporal
        run: npx --yes tsx scripts/test-alertas-cambios.ts
      - name: Test geometria de tres hojas
        run: npx --yes tsx scripts/test-tres-hojas-figuras.ts
      - name: Test testigos fisicos independientes
        run: npx --yes tsx scripts/test-tres-hojas-testigos.ts
      - name: Test pulsos sin familias
        run: npx --yes tsx scripts/test-pulsos-tres-hojas.ts
      - name: Regresion del motor oficial
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Reproducir alertas vs controles en octubre
        env:
          TRES_LABEL: octubre-alertas
          TRES_FROM: '2026-10-12'
          TRES_TO: '2026-10-28'
        run: npx --yes tsx scripts/lab-tres-hojas-figuras.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alertas-cambios-octubre
          path: auditorias/radar-tres-hojas/octubre-alertas.json
          if-no-files-found: warn
