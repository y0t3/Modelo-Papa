name: VT4 13oct verificar 5485 y 1057 con admision fisica
on:
  push:
    branches: [lab-vt4-admision-madres-13oct2026]
    paths:
      - 'scripts/lab-vt4-admision-13oct.mjs'
      - '.github/workflows/lab-vt4-admision-13oct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comparar 5485 y 1057 usando el mismo PRE firmado VT3 de Matutina
        run: node scripts/lab-vt4-admision-13oct.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vt4-admision-13oct-cotejo
          path: auditorias/vt4-admision-madres-115-13oct2026/13OCT_POST.json
          retention-days: 60
          if-no-files-found: error
      - name: Guardar contraste retrospective solo en laboratorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt4-admision-madres-115-13oct2026/13OCT_POST.json
          git commit -m 'data(VT4): verificar 5485 y 1057 con madres físicas sin raíces prestadas'
          git push origin HEAD:lab-vt4-admision-madres-13oct2026
