name: Verificar Top10 y minihojas de antecedentes
on:
  push:
    branches: [feature/top10-minihojas-lectura-29oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Instalar dependencias
        run: npm install
      - name: Comprobar tipos de la app
        run: npx tsc --noEmit
      - name: Regresión Lalo principal
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Regresión Lalo auxiliar
        run: npx --yes tsx scripts/test-motor-lalo-auxiliar.ts
