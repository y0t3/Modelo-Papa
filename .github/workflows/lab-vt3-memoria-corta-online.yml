name: VT3 memoria corta y aprendizaje turno a turno
on:
  push:
    branches: [lab-vt3-memoria-corta-online-13oct2026]
    paths:
      - 'scripts/lab-vt3-memoria-corta-online.mjs'
      - 'PROTOCOLO_VT3_MEMORIA_CORTA_ONLINE_13OCT2026.md'
      - '.github/workflows/lab-vt3-memoria-corta-online.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  memoria:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ocultar todos los POST y disponer unicamente de fichas PRE
        run: |
          mv auditorias /tmp/vt3-memoria-corta-base
          mkdir -p auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026
          cp /tmp/vt3-memoria-corta-base/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json
          test "$(find auditorias -type f | wc -l)" -eq 1
      - name: Sellar cortes ventanas temporales y 2000 controles neutrales
        run: node scripts/lab-vt3-memoria-corta-online.mjs pre
      - name: Reproducir memoria fija y dar lecciones SOLO tras cada resultado conocido
        run: |
          mv auditorias/vt3-memoria-corta-online-90-13oct2026 /tmp/vt3-memoria-corta-nuevo
          cp -a /tmp/vt3-memoria-corta-base/. auditorias/
          rm -rf auditorias/vt3-memoria-corta-online-90-13oct2026
          mv /tmp/vt3-memoria-corta-nuevo auditorias/vt3-memoria-corta-online-90-13oct2026
          node scripts/lab-vt3-memoria-corta-online.mjs post
      - uses: actions/upload-artifact@v4
        with:
          name: VT3-memoria-corta-online-90
          path: auditorias/vt3-memoria-corta-online-90-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Guardar auditoria reproducible solo en rama de estudio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-memoria-corta-online-90-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): memoria corta por 1-3 jornadas y enseñanza por turno'
            git push origin HEAD:lab-vt3-memoria-corta-online-13oct2026
          fi
