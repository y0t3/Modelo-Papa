name: VT3 equilibrio de estados sin alterar produccion
on:
  push:
    branches: [lab-vt3-equilibrio-estados-13oct2026]
    paths:
      - 'scripts/lab-vt3-equilibrio-estados.mjs'
      - 'PROTOCOLO_VT3_EQUILIBRIO_ESTADOS_13OCT2026.md'
      - '.github/workflows/lab-vt3-equilibrio-estados.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar-cuotas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apartar resultados POST antes de formar Tops
        run: |
          mv auditorias/vt3-nacimientos-convergencias-115-13oct2026/POST_115.json /tmp/vt3-equilibrio-post.json
          mv auditorias/vt3-nacimientos-convergencias-115-13oct2026/NOCTURNA_POST.json /tmp/vt3-equilibrio-nocturna.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json /tmp/vt3-equilibrio-base-post.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json /tmp/vt3-equilibrio-base-nocturna.json
      - name: Generar PRE de catorce políticas y sellar hashes
        run: node scripts/lab-vt3-equilibrio-estados.mjs pre
      - name: Restaurar resultados y evaluar 115 cortes
        run: |
          mv /tmp/vt3-equilibrio-post.json auditorias/vt3-nacimientos-convergencias-115-13oct2026/POST_115.json
          mv /tmp/vt3-equilibrio-nocturna.json auditorias/vt3-nacimientos-convergencias-115-13oct2026/NOCTURNA_POST.json
          mv /tmp/vt3-equilibrio-base-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json
          mv /tmp/vt3-equilibrio-base-nocturna.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json
          node scripts/lab-vt3-equilibrio-estados.mjs post
      - name: Respaldar evidencia completa
        uses: actions/upload-artifact@v4
        with:
          name: VT3-equilibrio-estados-115
          path: auditorias/vt3-equilibrio-estados-115-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Registrar auditoría en rama de investigación
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-equilibrio-estados-115-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): cuotas PRE selladas, resultados y permutaciones históricas'
            git push origin HEAD:lab-vt3-equilibrio-estados-13oct2026
          fi
