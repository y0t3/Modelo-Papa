name: VT3 D14 reserve without displacing D7
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt3-d14-reserve7d.yml'
      - 'src/vt3D14Reserve7d.ts'
      - 'scripts/test-vt3-d14-reserve7d.cjs'
      - 'scripts/run-vt3-d14-reserve7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2024"
            from: "2024-01-01"
            to: "2024-12-31"
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Confirm D7 preserved and D14 causal reserve
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt3-d14-reserve7d.cjs
      - name: Compare reserve against matched random pool
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-vt3-d14-reserve7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/vt3-d14-reserve-$LABEL.json"
      - name: Preserve full candidate choices and target results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vt3-d14-reserve-${{ matrix.label }}
          path: out/vt3-d14-reserve-*.json
          if-no-files-found: error
