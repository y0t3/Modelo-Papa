name: Verificar Inicio VT2 y Resumen Lalo
on:
  push:
    branches: ['feature/inicio-vt2-y-info-resumen-31oct2026']
    paths: ['App.tsx','src/**','scripts/test-inicio-resumen.ts','.github/workflows/validar-inicio-vt2-31oct.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Revisar tipado Android completo
        run: npx tsc --noEmit --project tsconfig.ui-check.json
      - name: Probar estados de jornada y coincidencias PRE/POST
        run: npx --yes tsx scripts/test-inicio-resumen.ts
      - name: Proteger encabezado, fondo, motores y minihojas
        run: |
          npx --yes tsx scripts/test-la-posta-identidad.ts
          npx --yes tsx scripts/test-hero-composition.ts
          npx --yes tsx scripts/test-wallpaper-lalo.ts
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-lalo-bayes-geometria-vt3.ts
          npx --yes tsx scripts/test-lalo-vt3-estadistico.ts
          npx --yes tsx scripts/test-motor-formas-primero.ts
          npx --yes tsx scripts/test-info-aux-trazas-visuales.ts
