name: VT3 novedad fisica vs respaldo 115 cortes
on:
  push:
    branches: [lab-vt3-novedad-fisica-vs-respaldo-14oct2026]
    paths:
      - 'scripts/lab-vt3-novedad-vs-respaldo.mjs'
      - 'PROTOCOLO_VT3_NOVEDAD_VS_RESPALDO_14OCT2026.md'
      - '.github/workflows/lab-vt3-novedad-vs-respaldo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ocultar resultados POST antes de PRE
        run: |
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json /tmp/vt3-novedad-post-base.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json /tmp/vt3-novedad-noct-post.json
          mv auditorias/vt3-transiciones-individuales-115-13oct2026/POST_115.json /tmp/vt3-novedad-post-transition.json
      - name: Seleccionar familias por cambio o presencia con PRE sellado
        run: node scripts/lab-vt3-novedad-vs-respaldo.mjs pre
      - name: Abrir resultado y evaluar con controles neutros
        run: |
          mv /tmp/vt3-novedad-post-base.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json
          mv /tmp/vt3-novedad-noct-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json
          mv /tmp/vt3-novedad-post-transition.json auditorias/vt3-transiciones-individuales-115-13oct2026/POST_115.json
          node scripts/lab-vt3-novedad-vs-respaldo.mjs post
      - name: Subir archivos reproducibles
        uses: actions/upload-artifact@v4
        with:
          name: VT3-novedad-fisica-vs-respaldo-115
          path: auditorias/vt3-novedad-vs-respaldo-115-14oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Versionar PRE POST y SELLO solo en laboratorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-novedad-vs-respaldo-115-14oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): novedades físicas vs soporte con controles en 115 cortes'
            git push origin HEAD:lab-vt3-novedad-fisica-vs-respaldo-14oct2026
          fi
