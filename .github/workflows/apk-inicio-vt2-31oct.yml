name: APK Lalo - Inicio VT2 y minihojas 0.3.24
on:
  push:
    branches: ['feature/inicio-vt2-y-info-resumen-31oct2026']
    paths: ['.github/workflows/apk-inicio-vt2-31oct.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencias
        run: npm install
      - name: Verificar nuevo Inicio y modelos
        run: |
          npx tsc --noEmit --project tsconfig.ui-check.json
          npx --yes tsx scripts/test-inicio-resumen.ts
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-lalo-bayes-geometria-vt3.ts
          npx --yes tsx scripts/test-hero-composition.ts
          npx --yes tsx scripts/test-wallpaper-lalo.ts
          npx --yes tsx scripts/test-la-posta-identidad.ts
      - name: APK de prueba independiente
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='app.json';
          const app=JSON.parse(fs.readFileSync(p,'utf8'));
          app.expo.name='Lalo - Inicio nuevo';
          app.expo.version='0.3.24';
          app.expo.android.package='com.y0t3.modelopapa.iniciovt2';
          app.expo.android.versionCode=30;
          fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Preparar Android con el banner y el fondo originales
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Mantener icono aprobado
        run: bash .github/scripts/icon-modelo-lalo.sh
      - name: Compilar APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Verificar integridad del instalador
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - name: Publicar instalador Android
        uses: actions/upload-artifact@v4
        with:
          name: Lalo-Inicio-VT2-APK-0.3.24
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
