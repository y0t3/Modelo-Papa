name: Validar tarjeta Tendencias VT2 Inicio Info
on:
  push:
    branches:
      - feature/tendencias-vt2-actualizacion-diaria-31oct2026
  pull_request:
    branches:
      - feature/tendencias-vt2-inicio-info-31oct2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar paquetes
        run: npm install
      - name: Validar TypeScript completo
        run: npx tsc --noEmit --project tsconfig.tendencias-app.json
      - name: Probar distribución histórica de tendencias
        run: npx --yes tsx scripts/test-tendencias-vt2.ts
      - name: Probar seguimiento diario sin alterar PRE ni duplicar aciertos
        run: npx --yes tsx scripts/test-tendencias-vt2-vivas.ts
      - name: Regresiones de navegación y pestañas
        run: npx --yes tsx scripts/test-info-fechas-atras.ts
      - name: Motor Lalo intacto
        run: npx --yes tsx scripts/test-motor-lalo.ts
  apk-prueba:
    if: github.event_name == 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Código exacto de las tarjetas aprobadas
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Java 17 para Gradle Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: npm install
      - name: Generar proyecto Android con iconografía actual
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Compilar aplicación Android independiente (release)
        working-directory: android
        env:
          NODE_ENV: production
          CI: '1'
        run: ./gradlew assembleRelease --no-daemon
      - name: Publicar APK de prueba en el run de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Modelo-Lalo-Tendencias-VT2-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
