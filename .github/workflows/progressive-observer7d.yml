name: Progressive plus 11 visual observation
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/progressive-observer7d.yml'
      - 'src/progressiveBoard7d.ts'
      - 'scripts/run-progressive-observer7d.cjs'
      - 'scripts/test-progressive-board7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Confirm five progressive turns and causal cutoff
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-progressive-board7d.cjs
      - name: Measure visual evidence during every turn
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-progressive-observer7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/progressive-$LABEL.json"
      - name: Preserve chronological visual evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: progressive-plus11-${{ matrix.label }}
          path: out/progressive-*.json
          if-no-files-found: error
