name: Validar Modelo Lalo VT2 VT3 VT4
on:
  push:
    branches: [modelo-lalo-motor-unificado-vt234]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx --yes tsx scripts/test-motor-lalo.ts
