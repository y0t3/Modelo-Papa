name: LAB Lalo VT3 figuras y transiciones
on:
  push:
    branches: [lab/lalo-movimiento-figuras-24oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometric-transitions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Preparar fuentes
        run: npm install
      - name: Estudiar figuras que nacen persisten y caminan entre fuentes
        run: |
          npx --yes tsx scripts/lab-lalo-movimiento-figuras.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - name: Guardar recorridos y Tops PRE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lalo-figuras-transiciones-vt3
          path: auditorias/lalo-figuras-transiciones-24oct/resultados
          if-no-files-found: warn
