name: VT3 posiciones primero, familias despues
on:
  push:
    branches: [lab-vt3-posiciones-14oct2026]
    paths:
      - 'scripts/lab-vt3-seleccion-geometrica-pura.mjs'
      - 'PROTOCOLO_VT3_SELECCION_GEOMETRICA_PURA_14OCT2026.md'
      - '.github/workflows/lab-vt3-posiciones-primero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geometricas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ocultar resultados objetivos del corpus
        run: |
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json /tmp/geo-vt3-post.json
          mv auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json /tmp/geo-vt3-nocturna-post.json
      - name: Elegir posiciones geometricas en PRE y sellar
        run: node scripts/lab-vt3-seleccion-geometrica-pura.mjs pre
      - name: Restaurar cabezas, cotejar VT3 y 2000 controles por posicion
        run: |
          mv /tmp/geo-vt3-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/POST_115.json
          mv /tmp/geo-vt3-nocturna-post.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_POST_DIAGNOSTICO.json
          node scripts/lab-vt3-seleccion-geometrica-pura.mjs post
      - name: Guardar resultados de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: VT3-geometria-antes-numeros-115
          path: auditorias/vt3-posiciones-geometricas-115-14oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Versionar solo auditoria en rama de laboratorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-posiciones-geometricas-115-14oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): geometria primero con PRE sellado y 2000 controles neutrales'
            git push origin HEAD:lab-vt3-posiciones-14oct2026
          fi
