name: LAB Lalo VT3 - anatomia de candidatas sin puesto
on:
  push:
    branches:
      - 'lab/lalo-vt3-anatomia-sin-puesto-31oct2026'
    paths:
      - 'src/labLaloAnatomiaSinPuestoVT3.ts'
      - 'scripts/lab-lalo-anatomia-sin-puesto-vt3.ts'
      - 'scripts/test-lalo-anatomia-vt3.ts'
      - '.github/workflows/lab-lalo-vt3-anatomia.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auditar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: 'junio-agosto', from: '2026-06-01', to: '2026-08-31', min: '250', skip: '0'}
          - {label: 'septiembre-octubre', from: '2026-09-01', to: '2026-10-29', min: '130', skip: '1'}
          - {label: 'viernes-30oct', from: '2026-10-30', to: '2026-10-30', min: '5', skip: '0'}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Reglas fisicas de Lalo y regresiones
        run: |
          npx --yes tsx scripts/test-lalo-anatomia-vt3.ts
          npx --yes tsx scripts/test-motor-formas-primero.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - name: Auditar oportunidades y cabezas por familia sin puesto
        env:
          ANATOMIA_FROM: ${{ matrix.from }}
          ANATOMIA_TO: ${{ matrix.to }}
          ANATOMIA_LABEL: ${{ matrix.label }}
          ANATOMIA_MIN_CUTS: ${{ matrix.min }}
          ANATOMIA_SKIP_OCT_EARLY: ${{ matrix.skip }}
        run: npx --yes tsx scripts/lab-lalo-anatomia-sin-puesto-vt3.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lalo-anatomia-vt3-${{ matrix.label }}
          path: auditorias/lalo-anatomia-vt3/${{ matrix.label }}.json
          if-no-files-found: warn
