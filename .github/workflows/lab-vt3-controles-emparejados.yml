name: LAB VT3 controles emparejados seis jornadas
on:
  push:
    branches: [lab/lalo-vt3-controles-emparejados-25oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Comparar actividad de ganadores frente a controles del mismo corte
        run: npx --yes tsx scripts/lab-vt3-controles-emparejados.ts
      - name: Proteger invariantes MV1
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Proteger Nocturnas historicas por jurisdiccion
        run: npx --yes tsx scripts/test-nocturna-anterior-por-jur.ts
      - uses: actions/upload-artifact@v4
        with:
          name: labo-vt3-controles-emparejados
          path: auditorias/lalo-vt3-matched6-25oct/resultados
          if-no-files-found: error
