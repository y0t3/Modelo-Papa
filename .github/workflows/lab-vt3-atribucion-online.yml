name: VT3 atribucion del aprendizaje reciente
on:
  push:
    branches: [lab-vt3-atribucion-aprendizaje-online-13oct2026]
    paths:
      - 'scripts/lab-vt3-atribucion-online.mjs'
      - 'PROTOCOLO_VT3_ATRIBUCION_ONLINE_13OCT2026.md'
      - '.github/workflows/lab-vt3-atribucion-online.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atribucion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aislar todos los resultados POST y conservar solo fichas originales PRE
        run: |
          mv auditorias /tmp/vt3-atribucion-historico
          mkdir -p auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026/
          cp /tmp/vt3-atribucion-historico/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json
          test "$(find auditorias -type f | wc -l)" -eq 1
      - name: Crear inventarios de 90 cortes y sellar sin cabeza futura
        run: node scripts/lab-vt3-atribucion-online.mjs pre
      - name: Reponer POST y reproducir propuestas congeladas, con trazas de ejemplos
        run: |
          mv auditorias/vt3-atribucion-online-90-13oct2026 /tmp/vt3-atribucion-pre-nuevo
          cp -a /tmp/vt3-atribucion-historico/. auditorias/
          rm -rf auditorias/vt3-atribucion-online-90-13oct2026
          mv /tmp/vt3-atribucion-pre-nuevo auditorias/vt3-atribucion-online-90-13oct2026
          node scripts/lab-vt3-atribucion-online.mjs post
      - uses: actions/upload-artifact@v4
        with:
          name: VT3-atribucion-online-90
          path: auditorias/vt3-atribucion-online-90-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Versionar informe PRE y POST solo en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-atribucion-online-90-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): causas geometricas de cambio de la tercera candidata por turno'
            git push origin HEAD:lab-vt3-atribucion-aprendizaje-online-13oct2026
          fi
