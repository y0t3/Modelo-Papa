name: VT3 diversidad de antecedentes reales
on:
  push:
    branches: [lab-vt3-diversidad-antecedentes-13oct2026]
    paths:
      - 'scripts/lab-vt3-diversidad-antecedentes.mjs'
      - 'PROTOCOLO_VT3_DIVERSIDAD_ANTECEDENTES_13OCT2026.md'
      - '.github/workflows/lab-vt3-diversidad-antecedentes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diversidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aislar PRE de TODOS los archivos POST y RESUMEN anteriores
        run: |
          mv auditorias /tmp/vt3-diversidad-otras-auditorias
          mkdir -p auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/
          cp /tmp/vt3-diversidad-otras-auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/PRE_115.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/PRE_115.json
          cp /tmp/vt3-diversidad-otras-auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_SIMULACION.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/NOCTURNA_SIMULACION.json
          test "$(find auditorias -type f | wc -l)" -eq 2
      - name: Construir y sellar Tops PRE y 2500 controles sin cabezas futuras
        run: node scripts/lab-vt3-diversidad-antecedentes.mjs pre
      - name: Restaurar POST únicamente después del sello
        run: |
          cp -a /tmp/vt3-diversidad-otras-auditorias/. auditorias/
          node scripts/lab-vt3-diversidad-antecedentes.mjs post
      - name: Guardar todos los Tops PRE, controles y POST
        uses: actions/upload-artifact@v4
        with:
          name: VT3-diversidad-antecedentes-115
          path: auditorias/vt3-diversidad-antecedentes-115-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Respaldar resultados en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-diversidad-antecedentes-115-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): diversidad de raíces PRE, controles y evaluación POST'
            git push origin HEAD:lab-vt3-diversidad-antecedentes-13oct2026
          fi
