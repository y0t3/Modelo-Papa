name: LAB VT3 zonas vinculadas
on:
  push:
    branches: [lab/vt3-zonas-vinculadas-25nov2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        periodo:
          - {nombre: febrero-marzo-2024, inicio: '2024-01-16', prueba: '2024-02-01', fin: '2024-03-31'}
          - {nombre: marzo-abril-2025, inicio: '2025-02-14', prueba: '2025-03-01', fin: '2025-04-30'}
          - {nombre: junio-julio-2026, inicio: '2026-05-16', prueba: '2026-06-01', fin: '2026-07-31'}
    name: ${{ matrix.periodo.nombre }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Contrastar zonas, vínculos y etiquetas alteradas
        env:
          ADM_FROM: ${{ matrix.periodo.inicio }}
          ADM_TO: ${{ matrix.periodo.fin }}
          TEST_FROM: ${{ matrix.periodo.prueba }}
        run: npx --yes tsx scripts/lab-vt3-zonas.ts
