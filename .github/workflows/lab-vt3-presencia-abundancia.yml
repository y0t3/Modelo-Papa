name: VT3 presencia vs abundancia y memoria placebo
on:
  push:
    branches: [lab-vt3-presencia-vs-abundancia-13oct2026]
    paths:
      - 'scripts/lab-vt3-presencia-abundancia.mjs'
      - 'PROTOCOLO_VT3_PRESENCIA_ABUNDANCIA_13OCT2026.md'
      - '.github/workflows/lab-vt3-presencia-abundancia.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  presencia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aislar resultados de sorteo y conservar solamente los dos PRE fisicos
        run: |
          mv auditorias /tmp/vt3-presencia-antiguos
          mkdir -p auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026
          mkdir -p auditorias/vt3-cobertura-bifurcaciones-115-13oct2026
          cp /tmp/vt3-presencia-antiguos/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json auditorias/vt3-dominio-semanal-top3-top5-115-13oct2026/PRE_115.json
          cp /tmp/vt3-presencia-antiguos/vt3-cobertura-bifurcaciones-115-13oct2026/PRE_115.json auditorias/vt3-cobertura-bifurcaciones-115-13oct2026/PRE_115.json
          test "$(find auditorias -type f | wc -l)" -eq 2
      - name: Generar inventarios sin cabezas y sellar experimento
        run: node scripts/lab-vt3-presencia-abundancia.mjs pre
      - name: Reponer POST y ensayar tres semanas con 500 bancos placebo
        run: |
          mv auditorias/vt3-presencia-abundancia-90-13oct2026 /tmp/vt3-presencia-nuevos
          cp -a /tmp/vt3-presencia-antiguos/. auditorias/
          rm -rf auditorias/vt3-presencia-abundancia-90-13oct2026
          mv /tmp/vt3-presencia-nuevos auditorias/vt3-presencia-abundancia-90-13oct2026
          node scripts/lab-vt3-presencia-abundancia.mjs post
      - uses: actions/upload-artifact@v4
        with:
          name: VT3-presencia-abundancia-90
          path: auditorias/vt3-presencia-abundancia-90-13oct2026/
          retention-days: 60
          if-no-files-found: error
      - name: Guardar solamente en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt3-presencia-abundancia-90-13oct2026/
          if ! git diff --cached --quiet; then
            git commit -m 'data(VT3): presencia vs abundancia, fuentes y placebo de memoria'
            git push origin HEAD:lab-vt3-presencia-vs-abundancia-13oct2026
          fi
