name: APK prueba - Lalo vistas simples 31oct
on:
  push:
    branches: [feature/redisenio-prediccion-info-boca-31oct2026]
    paths:
      - '.github/workflows/apk-vistas-simples-31oct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar paquetes
        run: npm install
      - name: Verificar pantallas, motores y banner
        run: |
          npx tsc --noEmit --project tsconfig.ui-check.json
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-lalo-bayes-geometria-vt3.ts
          npx --yes tsx scripts/test-la-posta-identidad.ts
          npx --yes tsx scripts/test-hero-composition.ts
          npx --yes tsx scripts/test-wallpaper-lalo.ts
      - name: Nombre e instalacion independientes de la app habitual
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='app.json';
          const app=JSON.parse(fs.readFileSync(p,'utf8'));
          app.expo.name='Lalo - Vista nueva';
          app.expo.version='0.3.23';
          app.expo.android.package='com.y0t3.modelopapa.vistanueva';
          app.expo.android.versionCode=29;
          fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Preparar Android con imagen y banner originales
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Mantener icono personalizado azul y dorado
        run: bash .github/scripts/icon-modelo-lalo.sh
      - name: Generar instalador APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Verificar instalador
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
      - name: Descargar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Lalo-Vista-Nueva-APK-0.3.23
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
