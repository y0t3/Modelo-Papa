name: Laboratorio VT3 configuraciones ganadoras conectadas
on:
  push:
    branches:
      - lab/configuraciones-vt3-conectadas-17oct2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Comprobar tipos del laboratorio
        run: npx tsc --noEmit
      - name: Comprobar pares físicos de cabezas sin fuga temporal
        run: npx --yes tsx scripts/test-lab-vt3-configuraciones-conectadas.ts
      - name: Barrer los 520 PRE con controles de figuras conectadas
        run: npx --yes tsx scripts/lab-figuras-comprobadas-a-pre.ts
      - name: Evaluar 16oct posterior al corpus sin alterar reglas experimentales
        env:
          LAB_EVALUAR_16_OCT: '1'
        run: npx --yes tsx scripts/lab-figuras-comprobadas-a-pre.ts
      - name: Guardar históricos positivos y negativos de los 520 cortes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAB-CONFIGURACIONES-CONECTADAS-520
          path: lab-results/FIGURAS_COMPROBADAS_A_PRE_*.json
          if-no-files-found: warn
