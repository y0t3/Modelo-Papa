name: Validar VT2 primero y navegación de todas las familias
on:
  push:
    branches: ['feature/primero-vt2-predictiva-info-31oct2026']
    paths: ['App.tsx','src/**','scripts/test-vt2-default-navegacion.ts','.github/workflows/validar-vt2-y-navegacion.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Tipos, navegación y recorrido físico del Combinado
        run: |
          npx tsc --noEmit --project tsconfig.ui-check.json
          npx --yes tsx scripts/test-vt2-default-navegacion.ts
          npx --yes tsx scripts/test-favoritos-inline.ts
          npx --yes tsx scripts/test-inicio-unico-fecha.ts
          npx --yes tsx scripts/test-inicio-resumen.ts
      - name: Motores e identidad original
        run: |
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-lalo-bayes-geometria-vt3.ts
          npx --yes tsx scripts/test-la-posta-identidad.ts
          npx --yes tsx scripts/test-hero-composition.ts
          npx --yes tsx scripts/test-wallpaper-lalo.ts
