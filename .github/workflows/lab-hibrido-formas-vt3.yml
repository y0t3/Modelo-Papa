name: LAB Híbridos Formas Primero Combinado VT3
on:
  push:
    branches:
      - lab/combinado-formas-vt3-top10-sustituciones-31oct2026
  pull_request:
    branches:
      - lab/formas-vs-combinado-vt3-historico-31oct2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm install
      - name: Estudio historico Top10 fijo y sustituciones PRE
        run: npx --yes tsx scripts/lab-hibrido-formas-combinado-vt3.ts
