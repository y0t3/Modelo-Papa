name: Verificar redisenio simple Lalo Info y Prediccion
on:
  push:
    branches:
      - 'feature/redisenio-prediccion-info-boca-31oct2026'
    paths:
      - 'src/**'
      - 'App.tsx'
      - '.github/workflows/validar-vistas-simples-31oct.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Revisar tipos y componentes de Android
        run: npx tsc --noEmit --project tsconfig.ui-check.json
      - name: Verificar integridad del banner y del fondo
        run: |
          npx --yes tsx scripts/test-la-posta-identidad.ts
          npx --yes tsx scripts/test-hero-composition.ts
          npx --yes tsx scripts/test-wallpaper-lalo.ts
      - name: Regresion de motores y nueva seleccion combinada
        run: |
          npx --yes tsx scripts/test-lalo-bayes-geometria-vt3.ts
          npx --yes tsx scripts/test-lalo-vt3-estadistico.ts
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-motor-formas-primero.ts
          npx --yes tsx scripts/test-info-aux-trazas-visuales.ts
