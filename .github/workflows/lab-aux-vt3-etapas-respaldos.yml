name: LAB AUX VT3 etapas y respaldos geometricos
on:
  push:
    branches:
      - 'lab/aux-vt3-etapas-respaldos-30oct2026'
    paths:
      - 'src/labAuxRespaldosVT3.ts'
      - 'scripts/lab-aux-etapas-respaldos-vt3.ts'
      - 'scripts/test-aux-etapas-respaldos-vt3.ts'
      - '.github/workflows/lab-aux-vt3-etapas-respaldos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: 'junio-agosto', from: '2026-06-01', to: '2026-08-31', minimo: '250', skip: '0'}
          - {label: 'septiembre-octubre', from: '2026-09-01', to: '2026-10-29', minimo: '130', skip: '1'}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Aislamiento PRE, invariancia de ubicaciones y geometrias fisicas
        run: npx --yes tsx scripts/test-aux-etapas-respaldos-vt3.ts
      - name: Regresion de lector base AUX y motor Lalo
        run: |
          npx --yes tsx scripts/test-aux-formas-primero-vt3.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - name: Reproduccion PRE original y dos prioridades de respaldos
        env:
          AUXFORMS_FROM: ${{ matrix.from }}
          AUXFORMS_TO: ${{ matrix.to }}
          AUXFORMS_LABEL: ${{ matrix.label }}
          AUXFORMS_MIN_CUTS: ${{ matrix.minimo }}
          AUXFORMS_SKIP_OCT_EARLY: ${{ matrix.skip }}
        run: npx --yes tsx scripts/lab-aux-etapas-respaldos-vt3.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aux-etapas-respaldos-${{ matrix.label }}
          path: auditorias/aux-formas-vt3/etapas-${{ matrix.label }}.json
          if-no-files-found: warn
