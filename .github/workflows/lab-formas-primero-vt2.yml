name: Laboratorio Formas Primero VT2 - 590 cortes contra Lalo
on:
  push:
    branches: [lab/motor-formas-primero-vt3-29oct2026]
    paths:
      - 'src/motorFormasPrimero.ts'
      - 'scripts/test-motor-formas-primero-vt2.ts'
      - 'scripts/lab-formas-primero-vt2-periodos.ts'
      - '.github/workflows/lab-formas-primero-vt2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Tipos app
        run: npx tsc --noEmit -p tsconfig.ui-check.json
      - name: VT2 pura geometria y PRE sin fuga
        run: npx --yes tsx scripts/test-motor-formas-primero-vt2.ts
      - name: VT3 y Lalo sin alteracion
        run: |
          npx --yes tsx scripts/test-motor-formas-primero.ts
          npx --yes tsx scripts/test-motor-lalo.ts
  periodos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        period:
          - {label: jun-jul, from: '2026-06-01', through: '2026-07-31'}
          - {label: ago-sep, from: '2026-08-01', through: '2026-09-30'}
          - {label: octubre, from: '2026-10-12', through: '2026-10-28'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Replay VT2 idénticos cortes PRE
        env:
          FORMAS_FROM: ${{ matrix.period.from }}
          FORMAS_THROUGH: ${{ matrix.period.through }}
          FORMAS_PERIOD: ${{ matrix.period.label }}
        run: npx --yes tsx scripts/lab-formas-primero-vt2-periodos.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Formas-Primero-VT2-${{ matrix.period.label }}
          path: auditorias/formas-primero-vt2/*-${{ matrix.period.label }}.json
          if-no-files-found: warn
