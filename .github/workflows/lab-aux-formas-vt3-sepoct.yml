name: LAB Formas Primero VT3 AUX - contraste septiembre-octubre
on:
  push:
    branches: [lab/aux-seleccion-geometrica-vt3]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Comprobar reglas PRE
        run: npx --yes tsx scripts/test-aux-formas-primero-vt3.ts
      - name: Septiembre-octubre sin cambiar los pesos
        env:
          AUXFORMS_FROM: '2026-09-01'
          AUXFORMS_TO: '2026-10-29'
          AUXFORMS_SKIP_OCT_EARLY: '1'
          AUXFORMS_LABEL: 'septiembre-octubre'
          AUXFORMS_MIN_CUTS: '130'
        run: npx --yes tsx scripts/lab-aux-formas-primero-vt3.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aux-formas-vt3-septiembre-octubre
          path: auditorias/aux-formas-vt3/septiembre-octubre.json
          if-no-files-found: warn
