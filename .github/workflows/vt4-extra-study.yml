name: Optional nonphysical VT4 extra
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt4-extra-study.yml'
      - 'src/vt4Extra7d.ts'
      - 'scripts/test-vt4extra7d.cjs'
      - 'scripts/run-vt4extra7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2024"
            from: "2024-01-01"
            to: "2024-12-31"
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: VT4 nonphysical provenance and future-leak prevention
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt4extra7d.cjs
      - name: Evaluate optional prefixes on historical dates
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-vt4extra7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/vt4-extra-$LABEL.json"
      - name: Save all optional projections and outcomes
        uses: actions/upload-artifact@v4
        with:
          name: vt4-extra-${{ matrix.label }}
          path: out/vt4-extra-*.json
          if-no-files-found: error
