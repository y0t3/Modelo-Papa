name: VT4 D7 D1 heads y caso 5832
on:
  push:
    branches: [lab-vt4-transferencia-rutas-ganadoras-13oct2026]
    paths:
      - 'scripts/lab-vt4-transferencia-conteo-cabezas.mjs'
      - '.github/workflows/lab-vt4-transferencia-cabezas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cotejar cantidad de cabezas únicas y origen D1 de 5832 sin reordenar Tops
        run: node scripts/lab-vt4-transferencia-conteo-cabezas.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vt4-auditoria-cabezas-5832
          path: auditorias/vt4-transferencia-rutas-ganadoras-115-13oct2026/ANALISIS_CABEZAS_Y_5832_POST.json
          retention-days: 60
          if-no-files-found: error
      - name: Guardar informe de auditoria en rama experimental
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditorias/vt4-transferencia-rutas-ganadoras-115-13oct2026/ANALISIS_CABEZAS_Y_5832_POST.json
          git commit -m 'data(VT4): heads exactas por política y coincidencia D1 de 5832'
          git push origin HEAD:lab-vt4-transferencia-rutas-ganadoras-13oct2026
