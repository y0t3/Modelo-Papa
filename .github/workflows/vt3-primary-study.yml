name: VT3 primary geometry study
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt3-primary-study.yml'
      - 'src/vt3Study7d.ts'
      - 'scripts/test-vt3study7d.cjs'
      - 'scripts/run-vt3study7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vt3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2024"
            from: "2024-01-01"
            to: "2024-12-31"
          - label: "2025"
            from: "2025-01-01"
            to: "2025-12-31"
          - label: "2026-jan-may"
            from: "2026-01-01"
            to: "2026-05-31"
          - label: "2026-jun-sep"
            from: "2026-06-01"
            to: "2026-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Test unchanged Top3, nested VT2, physical VT4, no lookahead
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt3study7d.cjs
      - name: Compare exact VT3 and nested suffix by month
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: |
          node scripts/run-vt3study7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --out="out/vt3-$LABEL.json"
      - name: Keep geometry and results
        uses: actions/upload-artifact@v4
        with:
          name: vt3-primary-${{ matrix.label }}
          path: out/vt3-*.json
          if-no-files-found: error
