name: VT3 true cross-column geometry vs structural coincidence
on:
  push:
    branches: [experimento-analisis-visual-5d]
    paths:
      - '.github/workflows/vt3-cross-column-structure7d.yml'
      - 'src/vt3CrossColumnStructure7d.ts'
      - 'scripts/test-vt3-cross-column-structure7d.cjs'
      - 'scripts/run-vt3-cross-column-structure7d.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2026-09-30"
            from: "2026-09-30"
            to: "2026-09-30"
          - label: "2026-september"
            from: "2026-09-01"
            to: "2026-09-30"
          - label: "2025-september"
            from: "2025-09-01"
            to: "2025-09-30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript
        run: npm install --prefix /tmp/mp-ts --no-save --ignore-scripts --no-audit --no-fund typescript@5.9.2
      - name: Prove shape invariance and no target leakage
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
        run: node scripts/test-vt3-cross-column-structure7d.cjs
      - name: Evaluate cross-column concrete VT3 digit patterns and shuffle null
        env:
          NODE_PATH: /tmp/mp-ts/node_modules
          FROM_DATE: ${{ matrix.from }}
          TO_DATE: ${{ matrix.to }}
          LABEL: ${{ matrix.label }}
        run: node scripts/run-vt3-cross-column-structure7d.cjs --from="$FROM_DATE" --to="$TO_DATE" --permutations=32 --out="out/vt3-cross-column-$LABEL.json"
      - name: Preserve all physical path groups and digit-only controls
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vt3-cross-column-${{ matrix.label }}
          path: out/vt3-cross-column-*.json
          if-no-files-found: error
