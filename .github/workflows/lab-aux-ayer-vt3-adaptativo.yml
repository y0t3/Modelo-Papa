name: LAB AUX AYER VT3 adaptativo
on:
  push:
    branches: [lab/aux-ayer-vt3-adaptativo-25nov2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cotejo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rango:
          - {nombre: agosto-octubre-2024, inicio: '2024-08-01', fin: '2024-10-20'}
          - {nombre: noviembre-diciembre-2024, inicio: '2024-11-01', fin: '2024-12-31'}
          - {nombre: febrero-marzo-2025, inicio: '2025-02-01', fin: '2025-03-31'}
          - {nombre: mayo-junio-2025, inicio: '2025-05-01', fin: '2025-06-30'}
          - {nombre: agosto-octubre-2025, inicio: '2025-08-01', fin: '2025-10-20'}
          - {nombre: febrero-marzo-2026, inicio: '2026-02-01', fin: '2026-03-31'}
          - {nombre: abril-mayo-2026, inicio: '2026-04-01', fin: '2026-05-31'}
          - {nombre: junio-julio-2026, inicio: '2026-06-01', fin: '2026-07-31'}
          - {nombre: agosto-2026, inicio: '2026-08-01', fin: '2026-08-31'}
          - {nombre: septiembre-noviembre-2026, inicio: '2026-09-15', fin: '2026-11-23'}
    name: ${{ matrix.rango.nombre }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Comparar reglas y señales con memoria estrictamente anterior
        env:
          ADM_FROM: ${{ matrix.rango.inicio }}
          ADM_TO: ${{ matrix.rango.fin }}
        run: npx --yes tsx scripts/lab-aux-ayer-vt3-adaptativo.ts
