name: CHECK integridad sello prospectivo Previa 26 octubre
on:
  push:
    branches: [lab/lalo-pulso-vt3-sellado-26oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Verificar sello inalterado sin consultar cabezas del lunes
        run: npx --yes tsx scripts/lab-comparar-sellado-previa-26oct.ts --validar
      - name: Regresion MV1
        run: npx --yes tsx scripts/test-motor-lalo.ts
