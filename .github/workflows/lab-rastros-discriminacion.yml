name: LAB Seguimiento VT3 testigos y controles
on:
  push:
    branches: [lab/lalo-vt3-rastros-discriminacion-25oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Contrastar testigos VT3 sin cambios a Tops
        run: npx --yes tsx scripts/lab-vt3-rastros-discriminacion.ts
      - name: Asegurar seguimiento sin fuga del turno futuro
        run: npx --yes tsx scripts/test-figure-tracking.ts
      - name: Verificar motor Lalo original
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        with:
          name: seguimiento-vt3-controles-historicos
          path: auditorias/lalo-vt3-rastros-discriminacion-25oct/resultados/
          if-no-files-found: error
