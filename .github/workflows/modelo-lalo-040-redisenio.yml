name: Modelo Lalo 0.4.0 - Navegacion y APK actualizable
on:
  push:
    branches:
      - feature/redisenio-navegacion-lalo-18nov2026
  pull_request:
    branches:
      - feature/info-diagnostico-vt3-corte-18nov2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias
        run: npm install --omit=optional --no-audit --no-fund
      - name: Validar tipos e interfaz
        run: npx tsc --noEmit --project tsconfig.tendencias-app.json
      - name: Revisar cortes previos VT3 sin fuga
        run: npx --yes tsx scripts/test-info-vt3-diagnostico.ts
      - name: Motor Lalo sin cambios
        run: npx --yes tsx scripts/test-motor-lalo.ts
      - name: Historial y navegacion
        run: npx --yes tsx scripts/test-info-fechas-atras.ts
      - name: Tendencias historicas VT2
        run: npx --yes tsx scripts/test-tendencias-vt2.ts
      - name: Seguimiento diario VT2
        run: npx --yes tsx scripts/test-tendencias-vt2-vivas.ts
  apk:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: npm install --omit=optional --no-audit --no-fund
      - name: Preparar Android conservando icono y fondo
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Compilar APK release 0.4.0
        working-directory: android
        env:
          CI: '1'
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Comprobar firma compatible con APK anterior
        shell: bash
        run: |
          set -euo pipefail
          SIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee /tmp/modelo-lalo-cert.txt
          grep -iq 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' /tmp/modelo-lalo-cert.txt || {
            echo 'ERROR: Certificado de firma diferente. No publicar como APK actualizable.'
            exit 1
          }
          echo 'Firma compatible con v0.3.9 verificada'
      - name: Publicar APK para actualizar sin desinstalar
        uses: actions/upload-artifact@v4
        with:
          name: Modelo-Lalo-0.4.0-Actualizacion-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 21
