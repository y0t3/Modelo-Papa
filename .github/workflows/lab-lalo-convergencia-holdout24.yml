name: LAB Lalo convergencia holdout 24oct
on:
  push:
    branches: [lab/lalo-vt3-convergencia-control-24oct2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Evaluar 24oct con selector fijo sin mirar resultados
        run: |
          npx --yes tsx scripts/lab-lalo-convergencia-holdout24.ts
          npx --yes tsx scripts/test-motor-lalo.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lalo-convergencia-holdout-24oct
          path: auditorias/lalo-filtro-vt3-25oct/holdout-24oct
          if-no-files-found: warn
