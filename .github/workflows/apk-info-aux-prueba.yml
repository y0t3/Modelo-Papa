name: APK Modelo Lalo INFO AUX - prueba Android
on:
  push:
    branches: [feature/info-aux-trazas-visuales-29oct2026]
    paths:
      - '.github/workflows/apk-info-aux-prueba.yml'
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: npm install
      - name: Tipos de Android y componentes INFO
        run: npx tsc --noEmit --project tsconfig.ui-check.json
      - name: Regresiones de motores y minihojas PRE/POST
        run: |
          npx --yes tsx scripts/test-info-aux-trazas-visuales.ts
          npx --yes tsx scripts/test-info-aux-predictiva-top3.ts
          npx --yes tsx scripts/test-aux-correcciones-info-vt4.ts
          npx --yes tsx scripts/lab-aux-dos-modos-regresion-test.ts
          npx --yes tsx scripts/test-figure-tracking.ts
          npx --yes tsx scripts/test-motor-lalo.ts
          npx --yes tsx scripts/test-consolidacion-lalo.ts
      - name: Nombre e identificador de prueba - no reemplaza la app estable
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.name = 'Modelo Lalo Prueba';
          app.expo.version = '0.3.10';
          app.expo.android.package = 'com.y0t3.modelopapa.infoaux';
          app.expo.android.versionCode = 16;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          console.log('APK de prueba independiente:', app.expo.name, app.expo.android.package);
          NODE
      - name: Generar proyecto Android
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Generar icono ML TEST para distinguir la prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p /tmp/modelo-lalo-icon
          convert -size 1024x1024 xc:'#10274A' -gravity center \
            -fill '#F6D36D' -font DejaVu-Sans-Bold -pointsize 285 \
            -annotate +0-60 'ML' -pointsize 93 -annotate +0+265 'PRUEBA' \
            /tmp/modelo-lalo-icon/icon.png
          for spec in 'mipmap-mdpi 48' 'mipmap-hdpi 72' 'mipmap-xhdpi 96' 'mipmap-xxhdpi 144' 'mipmap-xxxhdpi 192'; do
            set -- $spec
            dir=$1
            size=$2
            mkdir -p android/app/src/main/res/$dir
            rm -f android/app/src/main/res/$dir/ic_launcher.webp android/app/src/main/res/$dir/ic_launcher_round.webp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
            convert /tmp/modelo-lalo-icon/icon.png -resize ${size}x${size} PNG24:android/app/src/main/res/$dir/ic_launcher.png
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          done
      - name: Compilar APK independiente
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Comprobar que existe el APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
      - name: Publicar instalador de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Modelo-Lalo-INFO-AUX-Prueba-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
